services:
  plumber-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # Mesma variavel que o Cloud Run injeta; 8080 e o default do Dockerfile.api.
      PORT: 8080
    ports:
      # Host 33857 (default do front) -> porta 8080 do container.
      - "33857:8080"
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./plumber.R
          target: /api/plumber.R

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - plumber-api
    develop:
      watch:
        - action: sync
          path: ./front
          target: /app
          ignore:
            - node_modules/
        # Mudou dependencia -> sync nao basta, precisa refazer o npm install.
        - action: rebuild
          path: ./front/package.json